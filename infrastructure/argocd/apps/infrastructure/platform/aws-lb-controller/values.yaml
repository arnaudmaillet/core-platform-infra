# infrastructure/argocd/apps/infrastructure/platform/aws-lb-controller/values.yaml

aws-load-balancer-controller:
  # Webhook TLS via cert-manager (Issuer + Certificate the chart creates). The
  # chart's default self-signed cert is regenerated on EVERY render, and Argo CD
  # re-renders on every sync: the served cert and the webhook caBundle drifted
  # apart within minutes ("x509: certificate signed by unknown authority"), and
  # since the Service mutating webhook is failurePolicy Fail, NOTHING could create
  # a Service any more (CNPG, the fleet) — found live 2026-09-15. Chart >= 3
  # dropped `keepTLSSecret`, so cert-manager is the supported stable option.
  # cert-manager is installed by the security appset; the platform appset's
  # `retry` covers the first sync racing its CRDs.
  enableCertManager: true
  clusterName: ""
  region: ""
  vpcId: ""

  serviceAccount:
    create: true
    name: aws-load-balancer-controller
    annotations:
      eks.amazonaws.com/role-arn: ""