# k8s/overlays/staging/service-accounts.yaml
#
# IRSA-annotated ServiceAccounts for the services that need direct AWS access.
# namePrefix -> staging-<name>, which must match the trust subjects on the IAM
# roles (modules/security/irsa-roles audit_service_accounts / media_service_accounts:
# "default:staging-audit-server", etc.). The deployments reference these via
# serviceAccountName in their base (kustomize rewrites the prefix on both sides).
#
# Role ARNs are deterministic — "<cluster_name>-<svc>-role" in the fleet account —
# so they are pinned here (same convention as the hardcoded ECR registry account
# in `images:`). cluster_name = core-platform-staging.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-server
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::724772065879:role/core-platform-staging-audit-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-worker
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::724772065879:role/core-platform-staging-audit-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-server
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::724772065879:role/core-platform-staging-media-role
---
# ── Mesh caller identity (core-platform-infra#62, backend #852/#871) ──────────
# Plain ServiceAccounts (no IRSA): a mesh caller's projected token names its
# ServiceAccount, and the gated callee checks WHICH service is calling. One SA
# per participant, named after its app (namePrefix -> <env>-<app>, which the
# backend accepts). Callers: account-server (moderation, wallet),
# geo-discovery-server (wallet). Gated callees: moderation-server, wallet-server
# (their own token reads the cluster's JWKS, see mesh-identity-rbac.yaml).
# Attached via serviceAccountName in patch-mesh-identity.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geo-discovery-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moderation-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-server
