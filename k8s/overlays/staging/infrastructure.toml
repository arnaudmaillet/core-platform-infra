# Fleet-wide externalized infrastructure config (staging). Mounted into every service
# as /etc/infra/infrastructure.toml and hot-reloaded by the runtime — edit the
# ConfigMap and the change applies with no restart.

[resilience]
default_profile = "standard"

[resilience.profiles.standard]
timeout = { duration_ms = 10000 }
circuit_breaker = { failure_threshold = 5, success_threshold = 2, open_duration_ms = 30000, half_open_max_calls = 1 }
retry = { max_attempts = 3, backoff = { kind = "exponential", base_ms = 50, max_ms = 10000, jitter = "full" } }

# Dependency -> profile bindings. Only the `standard` profile exists in this overlay,
# so every binding resolves to it (same as the unbound fallback); the entry is here to
# make the dependency name discoverable and ready to re-point once more profiles land.
[resilience.bindings]
# timeline -> social-graph (fan-out + cold-rebuild reads)
"social-graph" = "standard"

# ── Ingress rate limits ───────────────────────────────────────────────────────
# Two listeners, resolved separately (guest-mode B5a, core-platform-backend#706):
#   * MESH (in-cluster callers, no principal): `bindings` / `default_profile`.
#     Keep it per_method — a per_caller profile here would put every in-cluster
#     caller of a method into one bucket.
#   * CLIENT EDGE (:9443 behind the ALB): `edge_bindings`, then
#     `edge_default_profile`. Members and guests are keyed on the token `sub`
#     (per_caller); anonymous methods on the client address the ALB appended to
#     X-Forwarded-For (per_ip, GRPC_TRUSTED_PROXY_HOPS = 1 — a WAF on the ALB
#     adds no hop, a CDN in front of it would make it 2).
# Values are PER REPLICA (mode = local). Mobile CGNAT shares IPv4 addresses,
# hence the generous per-IP limits.
[traffic]
default_profile      = "standard"   # mesh
edge_default_profile = "client"     # client edge

[traffic.profiles.standard]
rps   = 1000
burst = 200
scope = "per_method"

# Every client (member, or guest session: the token sub) gets its own bucket.
[traffic.profiles.client]
rps   = 50
burst = 100
scope = "per_caller"

[traffic.profiles.public-read]
rps   = 20
burst = 40
scope = "per_caller"

# RecordView / RecordShare: no actor, fire-and-forget.
[traffic.profiles.counters]
rps   = 5
burst = 20
scope = "per_caller"

# ── Anonymous (edge `public`) methods, keyed per IP ──
[traffic.profiles.guest-start]
rps      = 30
per_secs = 3600                     # 30 an hour per IP
burst    = 10
scope    = "per_ip"

# Login / Refresh. Refresh runs on every device on token expiry: watch
# infra_traffic_throttled_total{profile="login"} for CGNAT false positives.
[traffic.profiles.login]
rps      = 10
per_secs = 60                       # 10 a minute per IP
burst    = 10
scope    = "per_ip"

# SignUp (Sign in with Apple / Google id_token, or a one-time code) — B4a.
[traffic.profiles.sign-up]
rps      = 20
per_secs = 3600                     # 20 an hour per IP
burst    = 5
scope    = "per_ip"

# StartVerification (one-time code by email or SMS) — B4b/B4c. Kept low: each
# SMS costs money (toll fraud / SMS pumping); auth also budgets per address.
[traffic.profiles.verification]
rps      = 10
per_secs = 3600                     # 10 an hour per IP
burst    = 3
scope    = "per_ip"

# FindProfilesByContacts (address-book matching, up to 1000 hashed contacts a
# call): per account, against address-book enumeration. A burst of 10 covers an
# onboarding sync of a large address book, then ~100 a day (one every 864 s).
[traffic.profiles.contacts]
rps      = 100
per_secs = 86400                    # 100 a day per caller
burst    = 10
scope    = "per_caller"

[traffic.edge_bindings]
"/auth.v1.AuthService/StartGuestSession"   = "guest-start"
"/auth.v1.AuthService/Login"               = "login"
"/auth.v1.AuthService/Refresh"             = "login"
"/auth.v1.AuthService/SignUp"              = "sign-up"
"/auth.v1.AuthService/StartVerification"   = "verification"
# Second step of a two-step sign-in: public like Login (its mfa_token is the
# proof); auth also bounds guesses per account (5 per 15 min).
"/auth.v1.AuthService/CompleteLogin"       = "login"
# Single-use challenges / nonces written to Redis by anonymous callers.
"/auth.v1.AuthService/StartFederatedSignIn"   = "sign-up"
"/auth.v1.AuthService/StartPasskeySignIn"     = "sign-up"
"/auth.v1.AuthService/StartDeviceAttestation" = "guest-start"
"/account.v1.AccountService/FindProfilesByContacts" = "contacts"
"/engagement.v1.EngagementService/RecordView"  = "counters"
"/engagement.v1.EngagementService/RecordShare" = "counters"
# Public reads (edge rule `public_read` in the backend's service.rs files).
"/comment.v1.CommentService/GetComment"                  = "public-read"
"/comment.v1.CommentService/ListReplies"                 = "public-read"
"/comment.v1.CommentService/ListTopLevel"                = "public-read"
"/counter.v1.CounterService/BatchGetCounters"            = "public-read"
"/engagement.v1.EngagementService/GetPostEngagement"     = "public-read"
"/engagement.v1.EngagementService/BatchGetLikes"         = "public-read"
"/geo_discovery.v1.GeoDiscoveryService/GetGeoTimeline"   = "public-read"
"/geo_discovery.v1.GeoDiscoveryService/QueryTile"        = "public-read"
"/geo_discovery.v1.GeoDiscoveryService/GetCountryAccess" = "public-read"
"/geo_discovery.v1.GeoDiscoveryService/GetCountryStandings" = "public-read"
"/media.v1.MediaService/ResolveDelivery"                 = "public-read"
"/media.v1.MediaService/BatchResolveDelivery"            = "public-read"
"/post.v1.PostService/GetPost"                           = "public-read"
"/post.v1.PostService/ListPostsByProfile"                = "public-read"
"/profile.v1.ProfileService/GetProfileById"              = "public-read"
"/profile.v1.ProfileService/GetProfileByHandle"          = "public-read"
"/profile.v1.ProfileService/CheckHandleAvailability"     = "public-read"
"/profile.v1.ProfileService/ResolveShareToken"           = "public-read"
"/search.v1.SearchService/Search"                        = "public-read"
"/search.v1.SearchService/Suggest"                       = "public-read"
"/search.v1.SearchService/MultiSearch"                   = "public-read"
"/social_graph.v1.SocialGraphService/ListFollowers"      = "public-read"
"/social_graph.v1.SocialGraphService/ListFollowing"      = "public-read"
"/timeline.v1.TimelineService/GetDiscoveryFeed"          = "public-read"

# ── Cache profiles (consumed by profile's read-through caches) ────────────────
[cache]
default_profile = "standard"

[cache.profiles.standard]
ttl_secs = 300

[cache.profiles.handles]
ttl_secs = 600

[cache.bindings]
"profile-view" = "standard"
"handle-lookup" = "handles"

[telemetry]
log_filter = "info"
sampling   = { kind = "trace_id_ratio", ratio = 0.1 }
