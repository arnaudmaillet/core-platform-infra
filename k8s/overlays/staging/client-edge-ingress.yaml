# k8s/overlays/staging/client-edge-ingress.yaml
#
# The CLIENT EDGE: one internet-facing ALB, host-routed to the client-facing
# services' edge listeners (:9443). This is the fleet's gRPC front door for the
# mobile clients; the realtime WSS plane deliberately stays on its L4 NLB
# (realtime-gateway-public.yaml — an ALB would break the connection model).
#
#   * gRPC end to end: HTTPS/HTTP2 at the ALB (ACM wildcard cert, filled by the
#     envsubst CMP), h2c to the pods (backend-protocol-version GRPC).
#   * One ALB for the whole fleet: a single Ingress with one host rule per
#     service (`api-<svc>-staging.core-platform.click`, single-label so the
#     `*.core-platform.click` wildcard covers it). `group.name` lets a future
#     Ingress join the same ALB instead of provisioning another.
#   * Health check = the runtime-owned gRPC health service on the edge port
#     (always reachable without a token); gRPC status 0 = healthy.
#   * Idle timeout raised for the server-streaming RPCs (chat, notification):
#     the ALB default (60 s) would sever quiet streams.
#   * Not `inbound-cidrs`-restricted: this edge is public by design — every
#     listed RPC authenticates in the service (transport::grpc::edge), and the
#     NetworkPolicy opens :9443 only, never the mesh ports.
#
# external-dns (source: ingress) publishes every rule host below into the
# core-platform.click zone; no per-host annotation is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-edge
  labels:
    role: edge
  annotations:
    alb.ingress.kubernetes.io/group.name: staging-client-edge
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/backend-protocol-version: GRPC
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /grpc.health.v1.Health/Check
    alb.ingress.kubernetes.io/success-codes: "0"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  ingressClassName: alb
  rules:
    - host: api-account-staging.core-platform.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: account-server
                port:
                  number: 9443
    - host: api-auth-staging.core-platform.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-server
                port:
                  number: 9443
    - host: api-chat-staging.core-platform.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-server
                port:
                  number: 9443
    - host: api-comment-staging.core-platform.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comment-server
                port:
                  number: 9443
    - host: api-counter-staging.core-platform.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
