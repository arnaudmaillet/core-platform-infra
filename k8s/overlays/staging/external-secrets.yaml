# Pulls the managed-backend credentials (MSK SCRAM, Redis AUTH) the data-store
# Terraform modules wrote to Secrets Manager into a k8s Secret (backend-creds),
# which the service pods consume via envFrom (see patch). Auth uses the ESO IRSA
# role (modules/security/irsa-roles enable_external_secrets).
# ClusterSecretStore (NOT a namespaced SecretStore): the ESO IRSA ServiceAccount
# lives in the external-secrets namespace, and a namespaced SecretStore may only
# reference an SA in its OWN namespace — ESO's admission webhook rejects a
# cross-namespace serviceAccountRef ("namespace should be empty or match the
# SecretStore's namespace"). A ClusterSecretStore is cluster-scoped and may
# reference the operator's SA in external-secrets (the canonical IRSA pattern).
# Sync-wave -3: the topic-provisioner Job (wave -1) hard-depends on the
# backend-creds Secret (wave -2), which needs this store. A prior attempt left
# these unwaved ("ESO re-reconciles once the store exists") — true for the fleet
# pods, but the provisioner Job made the dependency hard and the first bring-up
# deadlocked with the Job as a PreSync hook. The trade-off stands: if the store
# fails to apply, the sync stalls before the fleet — which is now correct,
# because the fleet can't publish without the topics the Job creates.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-creds
  annotations:
    # Wave -2: materialized before the topic-provisioner Job (wave -1) starts —
    # ArgoCD waits on this resource's Ready health before advancing the wave.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  # Literal target name (kustomize doesn't prefix fields inside a CR), so the
  # envFrom in the deployment patch matches.
  target:
    name: backend-creds
  data:
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: "AmazonMSK_core-platform-staging_app", property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: "AmazonMSK_core-platform-staging_app", property: password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: "core-platform-staging-redis-auth", property: password }
---
# OpenSearch master creds for the search service (fine-grained access control).
# The ESO read policy already covers "core-platform-staging-*", so no IAM change.
# Injected into search-server via a dedicated envFrom patch (Block 5) rather than
# the fleet-wide backend-creds, since only search consumes them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: search-creds
  # secretKeys ARE the env var names (envFrom) — match what search reads exactly.
  data:
    - secretKey: SEARCH_OPENSEARCH_USER
      remoteRef: { key: "core-platform-staging-opensearch-master", property: username }
    - secretKey: SEARCH_OPENSEARCH_PASSWORD
      remoteRef: { key: "core-platform-staging-opensearch-master", property: password }
---
# media S3 static keys (rusty-s3 SigV4). These are an IAM user's access key —
# the media code does NOT use the IRSA role on its SA (see Block 5 notes). The SM
# secret core-platform-staging-media-s3 {access_key, secret_key} is provisioned by
# the data/app-secrets Terraform unit (was previously create-out-of-band).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-s3-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: media-s3-creds
  data:
    - secretKey: MEDIA_S3_ACCESS_KEY
      remoteRef: { key: "core-platform-staging-media-s3", property: access_key }
    - secretKey: MEDIA_S3_SECRET_KEY
      remoteRef: { key: "core-platform-staging-media-s3", property: secret_key }
---
# audit crypto/custody material. Static S3 keys (object-store + witness), the v1
# ENV-KEK and the checkpoint signing key. Real AWS KMS/HSM custody + cross-account
# WORM witness are the documented external deferral; this wires the v1 path. The SM
# secret core-platform-staging-audit-crypto is provisioned by the data/app-secrets
# Terraform unit (was previously create-out-of-band).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-crypto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: audit-crypto
  data:
    - secretKey: AUDIT_OBJECT_STORE_ACCESS_KEY
      remoteRef: { key: "core-platform-staging-audit-crypto", property: object_access_key }
    - secretKey: AUDIT_OBJECT_STORE_SECRET_KEY
      remoteRef: { key: "core-platform-staging-audit-crypto", property: object_secret_key }
    - secretKey: AUDIT_WITNESS_ACCESS_KEY
      remoteRef: { key: "core-platform-staging-audit-crypto", property: witness_access_key }
    - secretKey: AUDIT_WITNESS_SECRET_KEY
      remoteRef: { key: "core-platform-staging-audit-crypto", property: witness_secret_key }
    - secretKey: AUDIT_KEK_BASE64
      remoteRef: { key: "core-platform-staging-audit-crypto", property: kek_base64 }
    - secretKey: AUDIT_CHECKPOINT_SIGNING_KEY_BASE64
      remoteRef: { key: "core-platform-staging-audit-crypto", property: signing_key_base64 }
---
# auth ES256 signing keys + Keycloak client secrets (login + admin clients). The SM secret
# core-platform-staging-auth-secrets is provisioned by the data/app-secrets
# Terraform unit (was previously create-out-of-band). Keycloak itself is NOT yet
# provisioned (auth-prerequisite); the client secret is a generated placeholder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-secrets
  data:
    - secretKey: AUTH_SIGNING_PRIVATE_PEM
      remoteRef: { key: "core-platform-staging-auth-secrets", property: signing_private_pem }
    - secretKey: AUTH_SIGNING_PUBLIC_PEM
      remoteRef: { key: "core-platform-staging-auth-secrets", property: signing_public_pem }
    - secretKey: AUTH_KEYCLOAK_CLIENT_SECRET
      remoteRef: { key: "core-platform-staging-auth-secrets", property: keycloak_client_secret }
    # Service-account client for the Keycloak Admin API (ChangePassword /
    # VerifyCredentials); the realm import expects the same value.
    - secretKey: AUTH_KEYCLOAK_ADMIN_CLIENT_SECRET
      remoteRef: { key: "core-platform-staging-auth-secrets", property: keycloak_admin_client_secret }
---
# auth SES SMTP credentials (one-time email codes, guest-mode B4b). An IAM user's
# access key (username = key id, password = the derived SES SMTP password), only
# allowed to send through the SES domain identity as no-reply@. The SM secret
# core-platform-staging-auth-smtp is provisioned by the data/app-secrets Terraform
# unit. Kept OUT of auth-secrets on purpose: auth-server mounts it `optional`, so
# a missing SMTP secret never stops the TIER-0 auth plane from booting (only
# email codes fail, AUTH_VERIFICATION_SENDER=smtp with no credentials).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-smtp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-smtp
  data:
    - secretKey: AUTH_SMTP_USERNAME
      remoteRef: { key: "core-platform-staging-auth-smtp", property: username }
    - secretKey: AUTH_SMTP_PASSWORD
      remoteRef: { key: "core-platform-staging-auth-smtp", property: password }
---
# auth SNS static keys (one-time SMS codes, guest-mode B4c): an IAM user that may
# sns:Publish to phone numbers only (explicit Deny on every topic/endpoint ARN).
# The SM secret core-platform-staging-auth-sns is provisioned by the data/app-secrets
# Terraform unit. Mounted `optional` on auth-server, like auth-smtp.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-sns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-sns
  data:
    - secretKey: AUTH_SNS_ACCESS_KEY_ID
      remoteRef: { key: "core-platform-staging-auth-sns", property: access_key_id }
    - secretKey: AUTH_SNS_SECRET_ACCESS_KEY
      remoteRef: { key: "core-platform-staging-auth-sns", property: secret_access_key }
---
# auth MFA seed key (two-step sign-in, core-platform-infra#27): 32 random bytes
# (base64) that encrypt every TOTP seed, plus the key id stamped on the
# ciphertexts. Provisioned by data/app-secrets. Mounted `optional` on
# auth-server: absent, sign-in without 2FA works and enabling 2FA answers
# UNAVAILABLE. NEVER delete or regenerate it once anyone has enrolled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-mfa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-mfa
  data:
    - secretKey: AUTH_MFA_SEED_KEY
      remoteRef: { key: "core-platform-staging-auth-mfa", property: seed_key }
    - secretKey: AUTH_MFA_SEED_KEY_ID
      remoteRef: { key: "core-platform-staging-auth-mfa", property: seed_key_id }
---
# account GDPR export bucket keys (core-platform-infra#28): static keys of the
# <name>-account-exports IAM user (exports/ prefix only), used by rusty-s3 to
# write the archive and presign its 7-day link. Provisioned by data/app-secrets.
# Mounted `optional` on account-server (patch-account-exports.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-exports
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: account-exports
  data:
    - secretKey: ACCOUNT_EXPORT_S3_ACCESS_KEY
      remoteRef: { key: "core-platform-staging-account-exports", property: access_key_id }
    - secretKey: ACCOUNT_EXPORT_S3_SECRET_KEY
      remoteRef: { key: "core-platform-staging-account-exports", property: secret_access_key }
