# Inject ES256 signing keys + Keycloak client secret (auth-secrets) into auth-server.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: auth-secrets
# SES SMTP credentials for one-time email codes (auth-smtp ExternalSecret).
# optional: an unsynced SMTP secret must not block auth from starting.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: auth-smtp
      optional: true
# SNS keys for one-time SMS codes (auth-sns ExternalSecret), optional likewise.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: auth-sns
      optional: true
