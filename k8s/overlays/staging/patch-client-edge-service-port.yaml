# k8s/overlays/staging/patch-client-edge-service-port.yaml
#
# Exposes the client-edge listener (:9443) on each client-facing server's
# ClusterIP Service so the ALB target groups (target-type: ip, by Service port)
# can reach it (port order in the rendered Service is not significant). Targeted by app label
# in kustomization.yaml; the name below is a placeholder kustomize ignores.
apiVersion: v1
kind: Service
metadata:
  name: client-facing-server
spec:
  ports:
    - name: edge
      protocol: TCP
      port: 9443
      targetPort: 9443
      appProtocol: grpc
