# Media asset-lifecycle PostgreSQL via CloudNativePG. namePrefix ->
# staging-media-postgres; CNPG exposes staging-media-postgres-rw:5432 and a
# staging-media-postgres-app Secret (key `uri` = full connection string) wired
# into media-server (see patch-media-db.yaml).
#
# Postgres is media's asset-lifecycle SoR (the JSONB asset document). The bytes
# live in S3 (presigned direct upload/delivery) and the hot cache in ElastiCache;
# neither is provisioned here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: media-postgres
spec:
  # Staging cost: one instance (no standby). A lost node restarts it on a
  # database node in the same AZ (its EBS volume is zonal); prod keeps a standby.
  instances: 1
  # A single instance's primary PDB (minAvailable 1) would block every drain of
  # its node (spot reclaim, node-group teardown): off in staging.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: media
      owner: app
  storage:
    size: 10Gi
    storageClass: gp3
  # Pin to the database node tier and tolerate its taint, so the cluster lands on
  # the dedicated DB nodes instead of spilling onto general/spot capacity.
  # enablePodAntiAffinity spreads the two instances across AZs.
  affinity:
    nodeSelector:
      intent: database
    tolerations:
      - key: dedicated
        value: database
        effect: NoSchedule
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
  # Backups: the pod SA assumes the CNPG backup IRSA role and writes base backups
  # + WAL to the shared backups bucket under this cluster's prefix. Pruned by the
  # 30d retention policy. A nightly ScheduledBackup triggers base backups
  # (see scheduledbackups.yaml); WAL is archived continuously.
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::724772065879:role/core-platform-staging-cnpg-backup-role
  backup:
    barmanObjectStore:
      destinationPath: s3://core-platform-staging-cnpg-backups-724772065879/media
      s3Credentials:
        inheritFromIAMRole: true
    retentionPolicy: "30d"
