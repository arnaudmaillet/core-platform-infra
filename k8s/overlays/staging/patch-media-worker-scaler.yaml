# media-worker ScaledObject: point at MSK, add SASL/SCRAM + TLS + auth ref.
# Strategic-merge replaces the whole triggers list, so it is restated in full.
# Topic list = the event-topology registry's consumer edge for this worker
# (media self-consumes media.v1.events); keep them in lockstep.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: media-worker
spec:
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: ${MSK_BOOTSTRAP_BROKERS_SASL_SCRAM}
        consumerGroup: media-transcoder
        topic: media.v1.events
        lagThreshold: "20"
        offsetResetPolicy: earliest
        sasl: scram_sha512
        tls: enable
      authenticationRef:
        name: keda-msk-auth
