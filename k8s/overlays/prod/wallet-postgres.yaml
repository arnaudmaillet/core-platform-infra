# Wallet ledger PostgreSQL via CloudNativePG (core-platform-backend #665).
# namePrefix -> prod-wallet-postgres; CNPG exposes prod-wallet-postgres-rw:5432 and a
# prod-wallet-postgres-app Secret (key `uri`) wired into wallet-server (see
# patch-wallet-db.yaml). TIER-0 ledger: same HA, anti-affinity and backup posture
# as the other fleet clusters; the backup IRSA trust lists
# "default:prod-wallet-postgres" (security/irsa-roles).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wallet-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: wallet
      owner: app
  storage:
    size: 20Gi
    storageClass: gp3
  # Pin to the database node tier and tolerate its taint, so the cluster lands on
  # the dedicated DB nodes instead of spilling onto general/spot capacity.
  # enablePodAntiAffinity spreads the three instances across the three AZs.
  affinity:
    nodeSelector:
      intent: database
    tolerations:
      - key: dedicated
        value: database
        effect: NoSchedule
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
  # Backups: the pod SA assumes the CNPG backup IRSA role and writes base backups
  # + WAL to the shared backups bucket under this cluster's prefix. Pruned by the
  # 30d retention policy. A nightly ScheduledBackup triggers base backups
  # (see scheduledbackups.yaml); WAL is archived continuously.
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::724772065879:role/core-platform-prod-cnpg-backup-role
  backup:
    barmanObjectStore:
      destinationPath: s3://core-platform-prod-cnpg-backups-724772065879/wallet
      s3Credentials:
        inheritFromIAMRole: true
    retentionPolicy: "30d"
