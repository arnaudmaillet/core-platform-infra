# k8s/overlays/prod/patch-client-edge-env.yaml
#
# Enables the CLIENT EDGE listener on every client-facing server (targeted by
# app label in kustomization.yaml — workers and the TIER-0 audit plane are not
# in the set). The runtime then serves a second gRPC listener on :9443 guarded
# by transport's EdgeLayer: only the RPCs the service declares in its
# `EDGE_POLICY` are reachable, and callers must present a valid ES256 edge token
# minted by auth (verified in-process against auth's JWKS). Fail-closed: a
# missing verifier setting is a boot error, never an open listener.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GRPC_EDGE_ADDR
    value: "0.0.0.0:9443"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: EDGE_JWKS_URL
    value: "${AUTH_JWKS_URL}"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: EDGE_TOKEN_ISSUER
    value: "https://auth.core-platform.click"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: EDGE_TOKEN_AUDIENCE
    value: "core-platform"
# Proxies that append to X-Forwarded-For before the edge listener: the ALB only.
# `per_ip` rate limits (and geo-discovery, which falls back to this value) key
# on the client address that many entries from the right. A WAF on the ALB adds
# no hop; a CDN in front of the ALB (CloudFront…) does: bump this to 2, or every
# client shares the CDN's address. Set here, once, for every edge server.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GRPC_TRUSTED_PROXY_HOPS
    value: "1"
