# media-worker: DATABASE_URL (CNPG uri) into the worker (asset state + renditions).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prod-media-postgres-app
                  key: uri
