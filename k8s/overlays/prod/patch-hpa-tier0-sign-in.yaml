# k8s/overlays/prod/patch-hpa-tier0-sign-in.yaml
#
# The sign-in critical path (auth, and account which auth reads on every
# sign-in and refresh, fail-closed) keeps one replica per AZ in prod: 3 AZs,
# minReplicas 3 (core-platform-infra#69). Staging stays at the base minimum (2).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-server
spec:
  minReplicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-server
spec:
  minReplicas: 3
