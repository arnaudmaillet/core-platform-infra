# k8s/base/services/geo-discovery/server/deployment.yaml
#
# geo-discovery-server on the shared fleet runtime. Schema is provisioned by the migrator
# (init container) before the server starts. Image tags + the `infra-config` and
# `geo-discovery-config` ConfigMaps are supplied by the overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-discovery-server
  labels:
    app: geo-discovery-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geo-discovery-server
  template:
    metadata:
      labels:
        app: geo-discovery-server
    spec:
      # Spread replicas across AZs and nodes (ScheduleAnyway: never blocks
      # scheduling; the PDB is the hard guard against voluntary co-eviction).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: geo-discovery-server
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: geo-discovery-server
      # Apply this service's schema migrations before the server boots. The
      # migrator is self-contained (migrations embedded) and idempotent, so it is
      # safe to run on every rollout; it exits 0 once schema is up to date.
      initContainers:
        - name: migrate-geo-discovery
          image: core-platform-migrator
          args: ["geo-discovery"]
          envFrom:
            - configMapRef:
                name: geo-discovery-config
        # Country access (guest mode B10) needs the request's network country:
        # fetch the DB-IP Lite country database (MaxMind DB format, CC BY 4.0 —
        # "IP Geolocation by DB-IP", https://db-ip.com) for this month, else last
        # month (published early in the month). Fail-soft: without it the server
        # still serves the map and country access grants nothing. Refreshed at
        # every rollout.
        - name: fetch-geoip
          image: public.ecr.aws/docker/library/alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              y=$(date -u +%Y); m=$(date -u +%m); m=${m#0}
              pm=$((m - 1)); py=$y
              if [ "$pm" -eq 0 ]; then pm=12; py=$((y - 1)); fi
              for ym in "$y-$(printf %02d "$m")" "$py-$(printf %02d "$pm")"; do
                if wget -q -T 30 -O /geoip/country.mmdb.gz "https://download.db-ip.com/free/dbip-country-lite-$ym.mmdb.gz" \
                  && gunzip -f /geoip/country.mmdb.gz; then
                  echo "GeoIP: DB-IP Lite country $ym"; exit 0
                fi
              done
              echo "GeoIP: download failed - country access will grant nothing" >&2
              exit 0
          volumeMounts:
            - name: geoip
              mountPath: /geoip
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "64Mi"
      containers:
        - name: server
          image: core-platform-geo-discovery-server
          envFrom:
            - configMapRef:
                name: geo-discovery-config
          env:
            # The runtime is fail-closed on this file; mounted from infra-config.
            - name: INFRA_CONFIG_PATH
              value: /etc/infra/infrastructure.toml
            # Filled by the fetch-geoip init container (absent = grants nothing).
            - name: GEO_GEOIP_MMDB_PATH
              value: /var/lib/geoip/country.mmdb
            # Proxies that append to X-Forwarded-For before the pod: the ALB only.
            # Putting a CDN or WAF proxy in front (CloudFront…) adds a hop: bump
            # this to 2, or every guest gets the proxy's country.
            - name: GEO_TRUSTED_PROXY_HOPS
              value: "1"
          ports:
            - name: grpc
              containerPort: 50054
          volumeMounts:
            - name: infra-config
              mountPath: /etc/infra
              readOnly: true
            - name: geoip
              mountPath: /var/lib/geoip
              readOnly: true
          # Readiness gates on backend reachability: the per-service health key is
          # driven by the runtime's storage probes (SERVING only once they pass),
          # so a pod leaves rotation when a dependency is unreachable.
          readinessProbe:
            grpc:
              port: 50054
              service: geo_discovery.v1.GeoDiscoveryService
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness checks the overall ("") key = process alive, so a transient
          # backend blip drops readiness without triggering a restart loop.
          livenessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Soak-calibrated (2026-07-04): sized from observed throughput +
            # stability (p95 34ms I/O-bound, 0 OOM/restart at 2 replicas), NOT
            # measured utilization. Refine with `kubectl top` on next bring-up.
            requests:
              cpu: "100m"
              memory: "256Mi"
            # No CPU limit: CFS throttling breaks tokio tail latency under
            # spikes; memory stays the hard cap.
            limits:
              memory: "512Mi"
      volumes:
        - name: infra-config
          configMap:
            name: infra-config
        - name: geoip
          emptyDir:
            sizeLimit: 64Mi
