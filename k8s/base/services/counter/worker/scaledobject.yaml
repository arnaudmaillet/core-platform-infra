# k8s/base/services/counter/worker/scaledobject.yaml
#
# KEDA ScaledObject — worker scaling profile. Scales counter-worker on Kafka
# consumer-group LAG, not CPU: the right pressure signal for a stream processor.
#
# Requires KEDA installed in-cluster (helm install keda kedacore/keda -n keda).
# kustomize's built-in name-reference transformer does NOT rewrite a CRD's
# spec.scaleTargetRef.name for the overlay namePrefix — add a nameReference for
# kind: ScaledObject to the overlay's `configurations` (see the snippet shipped
# with this scaffold) or the prefix will mis-target the Deployment.
#
# maxReplicaCount is capped at the topic partition count: a Kafka consumer group
# cannot parallelize beyond its partitions, so extra pods would idle.
# `bootstrapServers` is a placeholder — patch it per-env in the overlay (or move
# it to a TriggerAuthentication backed by external-secrets).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: counter-worker
  labels:
    app: counter-worker
    role: worker
spec:
  scaleTargetRef:
    name: counter-worker
  minReplicaCount: 1
  maxReplicaCount: 12
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: kafka
      metadata:
        # Patched per-env. e.g. dev: redpanda.default.svc:9093 / prod: MSK bootstrap.
        bootstrapServers: KAFKA_BOOTSTRAP_PLACEHOLDER
        # The backend runs one consumer group PER TOPIC (view, impression, click,
        # wallet.v1.events, social-graph.follows); this base trigger watches the
        # main one. The staging/prod overlays restate one trigger per topic with
        # its real group (patch-counter-worker-scaler.yaml). Scale when lag exceeds:
        consumerGroup: counter-view-aggregator
        topic: view.v1.events
        lagThreshold: "5000"
        # `earliest` so a cold/reset consumer group counts the FULL unconsumed
        # backlog as lag and KEDA scales up to drain it — the right policy for an
        # analytics counter that must process every event. With `latest`, an
        # uncommitted group reads lag as ~0 and the worker silently under-scales.
        # (Matches the audit worker; the app consumer's own auto.offset.reset is
        # separate and lives in counter's runtime config.)
        offsetResetPolicy: earliest
