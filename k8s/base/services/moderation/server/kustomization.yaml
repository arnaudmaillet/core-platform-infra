# k8s/base/services/moderation/server/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
# Client-edge server (also listens on :9443 behind the ALB) and edge-token
# verifier: the overlays' edge patches and the allow-client-edge NetworkPolicy
# select on these labels, so this is the one place that lists the edge set.
labels:
  - pairs:
      client-edge: "true"
      edge-token-verifier: "true"
    includeTemplates: true
