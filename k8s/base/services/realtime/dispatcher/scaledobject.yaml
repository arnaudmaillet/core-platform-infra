# k8s/base/services/realtime/dispatcher/scaledobject.yaml
#
# KEDA ScaledObject — worker scaling on Kafka consumer-group lag. See the
# counter-worker ScaledObject for the full notes (KEDA prereq, namePrefix
# name-reference caveat, partition-count cap, bootstrapServers placeholder).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: realtime-dispatcher
  labels:
    app: realtime-dispatcher
    role: worker
spec:
  scaleTargetRef:
    name: realtime-dispatcher
  minReplicaCount: 1
  maxReplicaCount: 8
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: KAFKA_BOOTSTRAP_PLACEHOLDER
        # One consumer group PER TOPIC (realtime-notif-fanout, -post-fanout,
        # -counter-fanout); this base trigger watches the notification stream. The
        # staging/prod overlays restate one trigger per topic with its real group.
        consumerGroup: realtime-notif-fanout
        topic: notification.v1.events
        lagThreshold: "2000"
        offsetResetPolicy: latest
