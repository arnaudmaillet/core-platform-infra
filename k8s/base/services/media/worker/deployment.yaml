# k8s/base/services/media/worker/deployment.yaml
#
# media-worker — TIER-1 video transcode plane (media Plane B, CPU-heavy). Runs
# the supervised run_consumer lane on media.v1.events (group `media-transcoder`,
# filters to Video): ffprobe/ffmpeg 3-rung CMAF/HLS ladder + poster → object
# store. Serves NO domain RPC; it exposes only the gRPC health/reflection plane
# on :50071 so Kubernetes can probe readiness. Split from media-server so
# transcode CPU can never degrade the control-plane RPC latency (Plane A/C).
#
# Worker profile: throughput-bound, scaled on Kafka consumer-group lag (see
# scaledobject.yaml), NOT on CPU. terminationGracePeriod covers an in-flight
# transcode so an evicted pod can finish + commit offsets (manual-commit
# run_consumer contract) before SIGKILL; an interrupted one is simply
# redelivered (domain idempotency).
#
# Schema: media-server's migrator init container owns the media Postgres
# schema; this worker only reads/writes it (same DATABASE_URL via overlay patch).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  labels:
    app: media-worker
    role: worker
    tier: tier-1
spec:
  # Replicas are owned by the KEDA ScaledObject; this is just the seed value.
  replicas: 1
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
        role: worker
    spec:
      # Spread replicas across AZs and nodes (ScheduleAnyway: never blocks
      # scheduling). No PDB on a worker: a 1-replica PDB would block node drains.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: media-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: media-worker
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: core-platform-media-worker
          envFrom:
            - configMapRef:
                name: media-config
          env:
            - name: INFRA_CONFIG_PATH
              value: /etc/infra/infrastructure.toml
            - name: MEDIA_WORKER_GRPC_ADDR
              value: "0.0.0.0:50071"
          ports:
            - name: grpc
              containerPort: 50071
          volumeMounts:
            - name: infra-config
              mountPath: /etc/infra
              readOnly: true
            # ffmpeg work dir: the transcoder stages the source + every rendition
            # under std::env::temp_dir() before uploading. A bounded emptyDir keeps
            # a large video from filling the node's container layer.
            - name: scratch
              mountPath: /tmp
          # No typed service on a worker — probe the overall ("") health key:
          # SERVING once the consumer's backend probes pass.
          readinessProbe:
            grpc:
              port: 50071
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50071
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            # No CPU limit: a transcode should use whatever the node has idle
            # (CFS throttling only makes it slower); memory stays the hard cap.
            limits:
              memory: "2Gi"
      volumes:
        - name: infra-config
          configMap:
            name: infra-config
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
