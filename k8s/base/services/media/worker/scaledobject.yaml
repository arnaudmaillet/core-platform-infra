# k8s/base/services/media/worker/scaledobject.yaml
#
# KEDA ScaledObject — worker scaling profile. Scales media-worker on Kafka
# consumer-group LAG, not CPU: the right pressure signal for a stream processor.
#
# Requires KEDA in-cluster. kustomize's built-in name-reference transformer does
# NOT rewrite a CRD's spec.scaleTargetRef.name for the overlay namePrefix — the
# overlays carry a nameReference for kind: ScaledObject (scaledobject-refs-config).
#
# maxReplicaCount stays well under the topic partition count (12): a transcode
# is minutes of CPU, so a handful of pods already saturates a small node pool.
# `bootstrapServers` is a placeholder — patched per-env in the overlay.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: media-worker
  labels:
    app: media-worker
    role: worker
spec:
  scaleTargetRef:
    name: media-worker
  minReplicaCount: 1
  maxReplicaCount: 6
  # A transcode runs for minutes: don't scale down while a pod is mid-job.
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: kafka
      metadata:
        # Patched per-env. e.g. dev: redpanda.default.svc:9093 / prod: MSK bootstrap.
        bootstrapServers: KAFKA_BOOTSTRAP_PLACEHOLDER
        consumerGroup: media-transcoder
        topic: media.v1.events
        # media.v1.events carries EVERY media lifecycle event; the transcoder
        # skips non-video ones in microseconds, so lag is mostly image noise —
        # hence a threshold well above the per-video 1..5 a pure video topic
        # would warrant.
        lagThreshold: "20"
        # `earliest`: a cold/reset group counts the FULL unconsumed backlog as
        # lag and scales up to drain it (every upload must get its renditions).
        offsetResetPolicy: earliest
