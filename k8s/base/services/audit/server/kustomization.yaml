# k8s/base/services/audit/server/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
# Edge-token verifier (not client-edge): the overlays' revocation patch selects
# on this label.
labels:
  - pairs:
      edge-token-verifier: "true"
    includeTemplates: true
